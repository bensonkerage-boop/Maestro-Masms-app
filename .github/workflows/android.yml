name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      # Set API_BASE as a repository variable (Settings > Secrets and variables > Actions > Variables),
      # e.g. https://your-project.vercel.app
      - run: npm run build:android
        env:
          API_BASE: ${{ vars.API_BASE }}
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MASMS-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
